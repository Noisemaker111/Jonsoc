name: Build and Release Binaries

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 1.1.43)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write # Required for trusted publishing to npm

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build binary
        working-directory: packages/jonsoc
        run: |
          bun build --target=bun-linux-x64 --outfile=jonsoc-linux-x64 src/index.ts
          tar -czf jonsoc-linux-x64.tar.gz jonsoc-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jonsoc-linux-x64
          path: packages/jonsoc/jonsoc-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build binary
        working-directory: packages/jonsoc
        run: |
          bun build --target=bun-darwin-arm64 --outfile=jonsoc-darwin-arm64 src/index.ts
          zip -j jonsoc-darwin-arm64.zip jonsoc-darwin-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jonsoc-darwin-arm64
          path: packages/jonsoc/jonsoc-darwin-arm64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build binary
        working-directory: packages/jonsoc
        run: |
          bun build --target=bun-windows-x64 --outfile=jonsoc-windows-x64.exe src/index.ts
          Compress-Archive -Path jonsoc-windows-x64.exe -DestinationPath jonsoc-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jonsoc-windows-x64
          path: packages/jonsoc/jonsoc-windows-x64.zip

  publish-npm:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run typecheck || true

      - name: Publish to npm
        working-directory: packages/jonsoc
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: [build-linux, build-macos, build-windows, publish-npm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: jonsoc-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: artifacts/*
          draft: false
          prerelease: false
          body: |
            ## JonsOC v${{ steps.version.outputs.version }}

            An open source fork of [OpenCode](https://opencode.ai) 💐

            ### Installation

            ```bash
            npm install -g jonsoc@latest
            # or
            bun add -g jonsoc
            ```

            ### What's Changed

            See [CHANGELOG.md](./CHANGELOG.md) for details.

            ### Attribution

            This release is built on the amazing work of the [OpenCode](https://github.com/opencode-ai/opencode) team.
            Please consider supporting the original project!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
