name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build and publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          JONSOC_SKIP_DOCKER: "1"
          JONSOC_SKIP_ARCHIVE: "1"
          JONSOC_BUMP: ${{ github.event.inputs.bump }}
        run: |
          cd packages/jonsoc
          bun run script/publish.ts
